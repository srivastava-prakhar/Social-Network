version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socialdb}
      POSTGRES_USER: ${POSTGRES_USER:-socialuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata: